# Configuração da Newsletter Pessoal Automatizada
# Editável sem mexer em código.

categorias:
  - id: financas
    nome: "Finanças & Economia"
  - id: politica
    nome: "Política Brasil"
  - id: ia
    nome: "IA & Tecnologia"

fontes:
  # peso: influencia o ranking (Fase 4). 1.0 = padrão.
  # paywall: true faz o pipeline preferir excerpt + cobertura cruzada.
  # feeds: URLs RSS verificadas manualmente (curl) em 2026-09-19. Cada feed
  #   carrega sua(s) própria(s) categoria(s) — importante quando uma fonte
  #   publica feeds separados por editoria (ex.: Folha mercado/poder/tec):
  #   taggear pelo feed evita que notícia de política "vaze" pro pool de IA
  #   só porque a fonte, no geral, também cobre IA.
  - id: g1
    nome: "G1"
    peso: 1.0
    paywall: false
    feeds:
      - url: https://g1.globo.com/rss/g1/economia/
        categorias: [financas]
      - url: https://g1.globo.com/rss/g1/politica/
        categorias: [politica]

  - id: folha
    nome: "Folha de S.Paulo"
    peso: 1.1
    paywall: true
    feeds:
      - url: https://feeds.folha.uol.com.br/mercado/rss091.xml
        categorias: [financas]
      - url: https://feeds.folha.uol.com.br/poder/rss091.xml
        categorias: [politica]
      - url: https://feeds.folha.uol.com.br/tec/rss091.xml
        categorias: [ia]

  - id: estadao
    nome: "Estadão"
    peso: 1.1
    paywall: true
    feeds:
      # feed único e geral (não achei feeds por editoria) — hint ambíguo
      - url: https://www.estadao.com.br/arc/outboundfeeds/rss/?outputType=xml
        categorias: [politica, financas]

  - id: infomoney
    nome: "InfoMoney"
    peso: 1.0
    paywall: false
    feeds:
      - url: https://www.infomoney.com.br/feed/
        categorias: [financas]

  - id: nyt
    nome: "New York Times"
    peso: 1.0
    paywall: true
    feeds:
      - url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
        categorias: [financas]
      - url: https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml
        categorias: [ia]

  - id: valor_economico
    nome: "Valor Econômico"
    peso: 1.1
    paywall: true
    feeds:
      # feed único (não achei feed separado de política) — hint ambíguo
      - url: https://valor.globo.com/rss/valor
        categorias: [financas, politica]

  - id: bloomberg
    nome: "Bloomberg"
    peso: 1.1
    paywall: true
    feeds:
      - url: https://feeds.bloomberg.com/markets/news.rss
        categorias: [financas]

  - id: the_verge
    nome: "The Verge"
    peso: 1.0
    paywall: false
    feeds:
      - url: https://www.theverge.com/rss/index.xml
        categorias: [ia]

  - id: mit_tech_review
    nome: "MIT Technology Review"
    peso: 1.0
    paywall: true
    feeds:
      - url: https://www.technologyreview.com/feed/
        categorias: [ia]

  - id: agencia_brasil
    nome: "Agência Brasil"
    peso: 0.9
    paywall: false
    feeds:
      - url: https://agenciabrasil.ebc.com.br/rss/politica/feed.xml
        categorias: [politica]
      - url: https://agenciabrasil.ebc.com.br/rss/economia/feed.xml
        categorias: [financas]

  - id: poder360
    nome: "Poder360"
    peso: 0.9
    paywall: false
    feeds:
      - url: https://www.poder360.com.br/feed/
        categorias: [politica]

  - id: jota
    nome: "JOTA"
    peso: 0.9
    paywall: false
    feeds:
      - url: https://www.jota.info/feed
        categorias: [politica]

coleta:
  janela_horas: 48
  timeout_segundos: 15
  max_tentativas: 3
  user_agent: "NewsletterPessoalBot/0.1 (+lgabrielzp@gmail.com)"

curadoria:
  max_noticias_por_categoria: 5
  candidatos_pre_filtro_por_categoria: 20  # quantos vão pra triagem do Haiku, antes do corte final
  janela_dedupe_dias: 7
  limiar_similaridade_titulo: 0.90
  limiar_similaridade_conteudo: 0.75

modelos:
  triagem: "claude-haiku-4-5-20251001"
  redacao: "claude-sonnet-5"

schedule:
  hora: "06:00"
  timezone: "America/Sao_Paulo"
  frequencia: "diaria"

publicacao:
  base_url: "https://lgabrielzp-commits.github.io/newsletter-pessoal"
  branch: "gh-pages"

entrega:
  metodo: "email"
  assunto_template: "Newsletter — {data}"

design:
  cor_primaria: "#c41e3a"
  cor_fundo_header: "#1a1a1a"
