[project]
name = "newsletter"
version = "0.1.0"
description = "Newsletter pessoal automatizada de finanças, política e IA"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["newsletter*"]
